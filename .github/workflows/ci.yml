name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install quality tools
        run: python -m pip install ruff==0.9.10 PyYAML==6.0.2
      - name: Lint, workflow syntax, and shell syntax
        run: |
          ruff check src tests airflow scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflows = list(Path(".github/workflows").glob("*.yml"))
          assert workflows, "No GitHub Actions workflows found"
          for path in workflows:
              document = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              assert isinstance(document, dict) and "on" in document and "jobs" in document, path
          print(f"Parsed {len(workflows)} workflow(s).")
          PY
          bash -n scripts/*.sh
      - name: Compose and tracked-file hygiene
        run: |
          bash scripts/ci-env.sh
          docker compose --profile airflow --profile dashboard config --quiet
          python scripts/check_repository_hygiene.py
      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --check "$BASE_SHA" HEAD

  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run service-independent tests
        run: pytest -p no:cacheprovider -m "not docker and not heavy" -q

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality, fast-tests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create isolated CI configuration
        run: bash scripts/ci-env.sh
      - name: Build pipeline and Airflow test images
        run: docker compose --profile airflow build pipeline airflow-init minio-init
      - name: Start required services and wait for health
        run: |
          docker compose --profile airflow up -d --wait --wait-timeout 180 minio airflow-postgres
          docker compose --profile airflow run --rm minio-init
          docker compose --profile airflow run --rm analytics-db-init
          docker compose --profile airflow run --rm --no-deps --user airflow airflow-init airflow db migrate
      - name: Run real-service tests without historical datasets
        run: |
          docker compose --profile airflow run --rm --no-deps --user airflow \
            -e ICEBERG_CATALOG_PATH=/tmp/ci_iceberg_catalog.db \
            -e RUN_ICEBERG_INTEGRATION=1 -e RUN_SERVING_INTEGRATION=1 \
            airflow-init pytest -p no:cacheprovider -m "docker and not heavy" -q
      - name: Service diagnostics on failure
        if: failure()
        run: |
          docker compose --profile airflow ps
          docker compose --profile airflow logs --tail=100 minio airflow-postgres

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build project image without publishing it
        run: docker build --target pipeline --tag nyc-taxi-lakehouse:ci .
